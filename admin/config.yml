# ВНИМАНИЕ: файл создан скриптом tools/make-cms-config.ps1 — правьте скрипт и запускайте его заново.
# Админка: Sveltia CMS (https://sveltiacms.app). Совместима с Decap CMS.
backend:
  name: github
  repo: cpa-rggu/cpa-site
  branch: main
  commit_messages:
    create: 'Админка: создано «{{slug}}»'
    update: 'Админка: обновлено «{{slug}}»'
    delete: 'Админка: удалено «{{slug}}»'
    uploadMedia: 'Админка: загружен файл {{path}}'
    deleteMedia: 'Админка: удалён файл {{path}}'
# Все фото и PDF лежат в папке assets; в JSON путь записывается как assets/имя-файла
media_folder: assets
public_folder: assets
collections:
  - name: chronicle
    label: 'Хроника'
    description: 'Годы на главной: место, заголовок, текст и фотографии. Порядок в списке = порядок вкладок.'
    format: json
    editor: { preview: false }
    files:
      - name: chronicle
        label: 'Хроника независимости'
        file: content/chronicle.json
        fields:
          - name: items
            label: 'Годы'
            widget: list
            summary: '{{fields.year}}'
            label_singular: 'год'
            fields:
              - { name: year, label: 'Год', widget: string }
              - name: place
                label: 'Место (подпись под годом)'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: false }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: title
                label: 'Заголовок'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: false }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: text
                label: 'Текст'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: text, required: false }
                  - { name: en, label: 'English', widget: text, required: false }
                  - { name: fr, label: 'Français', widget: text, required: false }
                  - { name: pt, label: 'Português', widget: text, required: false }
                  - { name: sw, label: 'Kiswahili', widget: text, required: false }
              - { name: story, label: 'Ссылка на сюжет', widget: string, required: false, hint: 'Например: story.html?id=africa (код сюжета — из раздела «Сюжеты»). Пусто — на сайте будет «Сюжет готовится».' }
              - name: photos
                label: 'Фотографии (первая — главная)'
                widget: list
                summary: '{{fields.src}}'
                label_singular: 'фото'
                fields:
                  - { name: src, label: 'Фото', widget: image }
                  - { name: color, label: 'Показывать в цвете (марки, медали)', widget: boolean, default: false, required: false }
                  - name: caption
                    label: 'Подпись'
                    widget: object
                    fields:
                      - { name: ru, label: 'Русский', widget: string, required: false }
                      - { name: en, label: 'English', widget: string, required: false }
                      - { name: fr, label: 'Français', widget: string, required: false }
                      - { name: pt, label: 'Português', widget: string, required: false }
                      - { name: sw, label: 'Kiswahili', widget: string, required: false }
  - name: exhibitions
    label: 'Выставки'
    description: 'Баннер «Сейчас» и карточки прошедших выставок.'
    format: json
    editor: { preview: false }
    files:
      - name: exhibitions
        label: 'Выставки'
        file: content/exhibitions.json
        fields:
          - name: current
            label: 'Сейчас (большой баннер)'
            widget: object
            fields:
              - { name: id, label: 'Короткий код выставки (латиницей)', widget: string, hint: 'Например: dar. Из него получается адрес страницы: exhibition.html?id=dar' }
              - name: city
                label: 'Город, страна'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: false }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: venue
                label: 'Площадка'
