            widget: list
            summary: '{{fields.src}}'
            label_singular: 'фото'
            fields:
              - { name: src, label: 'Фото', widget: image }
              - name: credit
                label: 'Автор · источник · лицензия'
                hint: 'Например: Paul Weinberg · CC BY-SA 3.0'
                widget: object
                fields:
