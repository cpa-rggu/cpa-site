# ВНИМАНИЕ: файл создан скриптом tools/make-cms-config.ps1 — правьте скрипт и запускайте его заново.
# Админка: Sveltia CMS (https://sveltiacms.app). Совместима с Decap CMS.
backend:
  name: github
  repo: ProjectClaudeUhuru/cpa-site
  branch: main
  commit_messages:
    create: 'Админка: создано «{{slug}}»'
    update: 'Админка: обновлено «{{slug}}»'
    delete: 'Админка: удалено «{{slug}}»'
    uploadMedia: 'Админка: загружен файл {{path}}'
    deleteMedia: 'Админка: удалён файл {{path}}'
# Все фото и PDF лежат в папке assets; в JSON путь записывается как assets/имя-файла
media_folder: assets
public_folder: assets
collections:
  - name: chronicle
    label: 'Хроника'
    description: 'Годы на главной: место, заголовок, текст и фотографии. Порядок в списке = порядок вкладок.'
    format: json
    editor: { preview: false }
    files:
      - name: chronicle
        label: 'Хроника независимости'
        file: content/chronicle.json
        fields:
          - name: items
            label: 'Годы'
            widget: list
            summary: '{{fields.year}}'
            label_singular: 'год'
            fields:
              - { name: year, label: 'Год', widget: string }
              - name: place
                label: 'Место (подпись под годом)'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: title
                label: 'Заголовок'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: text
                label: 'Текст'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: text, required: true }
                  - { name: en, label: 'English', widget: text, required: false }
                  - { name: fr, label: 'Français', widget: text, required: false }
                  - { name: pt, label: 'Português', widget: text, required: false }
                  - { name: sw, label: 'Kiswahili', widget: text, required: false }
              - { name: story, label: 'Ссылка на сюжет', widget: string, required: false, hint: 'Пока пусто — на сайте будет «Сюжет готовится». Когда появится страница сюжета, впишите её адрес.' }
              - name: photos
                label: 'Фотографии (первая — главная)'
                widget: list
                summary: '{{fields.src}}'
                label_singular: 'фото'
                fields:
                  - { name: src, label: 'Фото', widget: image }
                  - { name: color, label: 'Показывать в цвете (марки, медали)', widget: boolean, default: false, required: false }
                  - name: caption
                    label: 'Подпись'
                    widget: object
                    fields:
                      - { name: ru, label: 'Русский', widget: string, required: true }
                      - { name: en, label: 'English', widget: string, required: false }
                      - { name: fr, label: 'Français', widget: string, required: false }
                      - { name: pt, label: 'Português', widget: string, required: false }
                      - { name: sw, label: 'Kiswahili', widget: string, required: false }
  - name: exhibitions
    label: 'Выставки'
    description: 'Баннер «Сейчас» и карточки прошедших выставок.'
    format: json
    editor: { preview: false }
    files:
      - name: exhibitions
        label: 'Выставки'
        file: content/exhibitions.json
        fields:
          - name: current
            label: 'Сейчас (большой баннер)'
            widget: object
            fields:
              - name: city
                label: 'Город, страна'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: venue
                label: 'Площадка'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - { name: date, label: 'Даты', widget: string, hint: 'Например: 10.2026 — 12.2026. Пока даты не подтверждены — в квадратных скобках.' }
              - { name: photo, label: 'Фото', widget: image }
              - { name: sample, label: 'Пометка «ПРИМЕР» (данные ещё не настоящие)', widget: boolean, default: true, required: false }
              - { name: link, label: 'Ссылка на страницу выставки', widget: string, required: false, hint: 'Пока пусто — страница выставки появится на следующем этапе.' }
          - name: past
            label: 'Прошедшие выставки (новые — сверху)'
            widget: list
            summary: '{{fields.date}}'
            label_singular: 'выставку'
            fields:
              - name: city
                label: 'Город, страна'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - name: venue
                label: 'Площадка'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
                  - { name: fr, label: 'Français', widget: string, required: false }
                  - { name: pt, label: 'Português', widget: string, required: false }
                  - { name: sw, label: 'Kiswahili', widget: string, required: false }
              - { name: date, label: 'Даты', widget: string, hint: 'Например: 10.2026 — 12.2026. Пока даты не подтверждены — в квадратных скобках.' }
              - { name: photo, label: 'Фото', widget: image }
              - { name: sample, label: 'Пометка «ПРИМЕР» (данные ещё не настоящие)', widget: boolean, default: true, required: false }
              - { name: link, label: 'Ссылка на страницу выставки', widget: string, required: false, hint: 'Пока пусто — страница выставки появится на следующем этапе.' }
  - name: publications
    label: 'Публикации'
    description: 'Статьи учёных Центра. На главной показываются первые три с галочкой «На главной».'
    format: json
    editor: { preview: false }
    files:
      - name: publications
        label: 'Публикации'
        file: content/publications.json
        fields:
          - name: items
            label: 'Статьи (новые — сверху)'
            widget: list
            summary: '{{fields.year}} · {{fields.id}}'
            label_singular: 'статью'
            fields:
              - { name: id, label: 'Короткий код статьи (латиницей, без пробелов)', widget: string, hint: 'Например: somaliland. Нужен для будущей страницы публикаций.' }
              - { name: featured, label: 'На главной', widget: boolean, default: true, required: false }
              - { name: year, label: 'Год', widget: string }
              - { name: region, label: 'Регион', widget: select, options: [{ label: 'Западная Африка', value: west }, { label: 'Восточная Африка', value: east }] }
              - name: author
                label: 'Автор'
                hint: 'Так, как подписывать на сайте: «Н.А. Медушевский» / «N.A. Medushevsky».'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
              - name: title
                label: 'Название статьи'
                hint: 'Русское название и авторский английский вариант. Для FR/PT/SW сайт показывает английский.'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
              - name: journal
                label: 'Журнал'
                hint: 'Без кавычек и номера: Клио / Clio.'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: string, required: true }
                  - { name: en, label: 'English', widget: string, required: false }
              - { name: issue, label: 'Год и номер выпуска', widget: string, hint: 'Например: 2025, № 7' }
              - { name: pages, label: 'Страницы', widget: string, required: false }
              - { name: doi, label: 'DOI', widget: string, required: false, hint: 'Только сам номер, например 10.24412/2070-9773-2025-7223-97-103' }
              - { name: pdf, label: 'PDF статьи', widget: file, required: false }
              - { name: cyberleninka, label: 'Ссылка на КиберЛенинку', widget: string, required: false }
              - name: keywords
                label: 'Ключевые слова (через точку с запятой)'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: text, required: true }
                  - { name: en, label: 'English', widget: text, required: false }
              - name: abstract
                label: 'Аннотация'
                hint: 'Авторская аннотация — не переписывать по смыслу.'
                widget: object
                fields:
                  - { name: ru, label: 'Русский', widget: text, required: true }
                  - { name: en, label: 'English', widget: text, required: false }
