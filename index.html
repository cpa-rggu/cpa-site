<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Африка. Путь к независимости — Центр прикладной африканистики РГГУ</title>
<meta name="description" content="Цифровая выставка Центра прикладной африканистики РГГУ: национально-освободительное движение в Африке и роль Советского Союза в нём.">
<link rel="icon" type="image/png" href="assets/logo_dark__fc87e939.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;800&family=Oswald:wght@600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
<!--
  Тексты на странице не пишутся здесь: их подставляет js/main.js из файлов content/*.json.
  Поэтому меняйте тексты в админке (/admin) или прямо в JSON-файлах.
-->

<header class="site-header">
  <div class="wrap header-row">
    <a href="#top" class="brand">
      <span class="logo" data-logo></span>
      <span class="brand-text">
        <span class="brand-org" data-t="header.org"></span>
        <span class="brand-uni" data-t="header.uni"></span>
      </span>
    </a>
    <nav class="nav" data-nav></nav>
    <div class="lang-dd" data-lang-dd></div>
    <button type="button" class="burger" data-burger aria-expanded="false" data-t-aria="header.menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="mobile-menu" data-mobile-menu hidden>
    <nav class="mobile-nav" data-nav></nav>
    <div class="langs langs-dark" data-langs></div>
  </div>
</header>

<main>
<section id="top" class="hero">
  <div class="cpa-orbit" aria-hidden="true" data-orbits></div>
  <div class="cpa-tiles" data-tiles></div>
  <div class="hero-panel">
    <div class="hero-kicker"><span data-t="hero.kicker"></span><span>1957—1994</span></div>
    <h1 class="hero-title"><span data-t="hero.h1a"></span><br><span data-t="hero.h1b"></span></h1>
    <p class="hero-desc" data-t="hero.desc"></p>
    <div class="hero-actions">
      <a href="#timeline" class="btn-dark btn-chron"><span data-t="hero.btnChron"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <form class="numform" data-numform>
        <label for="exhibit-num" class="sr-only" data-t="hero.numLabel"></label>
        <span class="numform-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="1.8"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M18 14h2v2M14 18v2h2M20 20h-2"/></svg>
        </span>
        <input id="exhibit-num" type="text" inputmode="decimal" autocomplete="off" data-t-ph="hero.numPh" data-t-ph-mobile="hero.numShort">
        <button type="submit" data-t="hero.open"></button>
      </form>
    </div>
    <span class="hero-qr">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M18 14h2v2M14 18v2h2M20 20h-2"/></svg>
      <span data-t="hero.qr"></span>
    </span>
  </div>
</section>

<section id="timeline" class="timeline">
  <div class="wrap timeline-inner">
    <div class="section-head">
      <h2 class="h2"><span data-t="chronicle.tlA"></span><br><span data-t="chronicle.tlB"></span></h2>
      <p class="section-hint hint-desktop" data-t="chronicle.tlHint"></p>
      <p class="section-hint hint-mobile" data-t="chronicle.swipe"></p>
    </div>
    <div class="years noscroll" role="tablist" data-years data-t-aria="chronicle.yearsLabel"></div>
    <div class="tl-stage" data-tl-stage data-swipe="tl"></div>
  </div>
</section>

<section id="exhibitions" class="wrap exhibitions">
  <div class="section-head">
    <h2 class="h2" data-t="exhibitions.exh"></h2>
    <p class="section-hint" data-t="exhibitions.exhHint"></p>
  </div>
  <div data-ex-now></div>
  <span class="swipe-hint"><span data-t="common.swipe"></span> →</span>
  <div class="ex-grid noscroll" data-ex-grid></div>
  <a href="#about" class="host-card host-mobile" data-host-link>
    <span class="host-title" data-t="exhibitions.hostTitle"></span>
    <span class="host-text" data-t="exhibitions.hostText"></span>
    <span class="host-btn" data-t="exhibitions.host"></span>
  </a>
</section>

<section id="publications" class="publications">
  <div class="wrap pub-inner">
    <div class="section-head">
      <div class="pub-head">
        <span class="kicker-accent" data-t="publications.pubKicker"></span>
        <h2 class="h2" data-t="publications.pubH"></h2>
      </div>
      <p class="section-hint" data-t="publications.pubHint"></p>
    </div>
    <div class="pub-list" data-pubs></div>
    <div class="pub-actions">
      <a href="publications.html" class="btn-dark"><span data-t="publications.pubAll"></span>&nbsp;→</a>
      <a href="publications.html#upload" class="btn-outline" data-t="publications.pubAdd"></a>
    </div>
  </div>
</section>

<section id="about" class="about">
  <div class="wrap about-inner">
    <figure class="about-logo">
      <img src="assets/logo_dark__fc87e939.png" alt="" data-band-alt>
      <figcaption data-band></figcaption>
    </figure>
    <div class="about-text">
      <h2 class="h2" data-t="about.about"></h2>
      <p class="about-lead" data-t="about.aboutText"></p>
      <div class="contacts">
        <div class="contact" data-hide-empty="about.vDirector"><span class="label" data-t="about.lDirector"></span><span data-t="about.vDirector"></span></div>
        <div class="contact"><span class="label" data-t="about.lEmail"></span><a data-email href="#about"></a></div>
        <div class="contact"><span class="label" data-t="about.lPhone"></span><span data-t="about.vPhone"></span></div>
        <div class="contact"><span class="label" data-t="about.lAddr"></span><span data-t="about.vAddr"></span></div>
        <div class="contact" data-hide-empty="about.docUrl"><span class="label" data-t="about.lDoc"></span><a data-t="about.vDoc" data-t-href="about.docUrl" target="_blank" rel="noopener"></a></div>
        <div class="contact contact-partners"><span class="label" data-t="exhibitions.lPartners"></span><a href="#about" data-host-link data-t="exhibitions.host"></a></div>
      </div>
      <a href="#about" class="btn-outline about-host-mobile" data-host-link data-t="exhibitions.host"></a>
    </div>
  </div>
</section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-row">
      <span data-t="footer.copy"></span>
    </div>
  </div>
</footer>

<div class="toast" role="status" aria-live="polite" data-toast hidden></div>
<noscript><p class="noscript">Для работы сайта нужен JavaScript. / JavaScript is required.</p></noscript>

<script src="js/common.js"></script>
<script src="js/main.js"></script>
</body>
</html>
